<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js Sample</title>

    <!-- CDN AR flame and Ar.js libraries  -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <style>
      h1 {
        width: 100%;
        height: 10%;
      }
      .scene-box {
        width: 50%;
        height: 50%;
      }
    </style>

  </head>
  
  <body style="margin:0; overflow:hidden;">

    <h1> Hello World </h1>

    <div class="scene-box">
      <a-scene embedded arjs vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true;">
  
        <!-- Read 3D model -->
        <a-assets>
          <a-asset-item id="petal" src="./petal.glb"></a-asset-item>
          <a-asset-item id="petal_pink" src="./petal_pink.glb"></a-asset-item>
        </a-assets>
  
        <!-- Read patt file as a Marker  -->
        <a-marker type="pattern" url="./pattern-petals.patt">
          <!-- Call the 3D model. -->
          <a-entity rotation="-90 0 0" position="0 0 -1" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          
          <a-entity rotation="-90 0 0" position="0.5 0 -1.25" scale="0.1 0.1 0.1"  gltf-model="#petal_pink"></a-entity>
          <a-entity rotation="-90 0 0" position="1 0 -1.5" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 0 0" position="1.5 0 -1.75" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          
          <a-entity rotation="-90 0 0" position="2 0 -2" scale="0.1 0.1 0.1"  gltf-model="#petal_pink"></a-entity>
          
          <a-entity rotation="-90 0 0" position="2.5 0 -1.5" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 0 0" position="3 0 -1" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 0 0" position="3.5 0 -0.5" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          
          <a-entity rotation="-90 0 0" position="4 0 0" scale="0.1 0.1 0.1"  gltf-model="#petal_pink"></a-entity>
          
          <a-entity rotation="-90 0 0" position="3.5 0 0.5" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 0 0" position="3 0 1" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 0 0" position="2.5 0 1.5" scale="0.1 0.1 0.1"  gltf-model="#petal_pink"></a-entity>
          
          <a-entity rotation="-90 0 0" position="2 0 2" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          
          <a-entity rotation="-90 0 0" position="1.5 0 2.25" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 0 0" position="1 0 2.5" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 0 0" position="0.5 0 2.75" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          
          <a-entity rotation="-90 0 0" position="0 0 3" scale="0.1 0.1 0.1"  gltf-model="#petal_pink"></a-entity>
  
          
          <a-entity rotation="-90 -180 45" position="-1 0 -2" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 -180 90" position="-0.5 0 -2" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
          <a-entity rotation="-90 -180 135" position="-1 0 -1" scale="0.1 0.1 0.1"  gltf-model="#petal"></a-entity>
        </a-marker>
  
        <!-- <a-marker preset="hiro">
          <a-box position="0 0.5 0" color="blue"></a-box>
        </a-marker> -->
        <a-entity camera></a-entity>
      </a-scene>

    </div>

  </body>
</html>
